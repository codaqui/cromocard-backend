name: compose-validate
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/compose-validate.yml"]
  push:
    branches: [main, develop]
    paths: ["infra/**"]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config -q (hml e prod, com e sem frontend; ops)
        working-directory: infra
        run: |
          for e in hml prod; do
            docker compose -p cromocard-$e --env-file validacao.env.example \
              -f docker-compose.yml -f compose.$e.yml config -q
            echo "$e OK"
            docker compose -p cromocard-$e --env-file validacao.env.example \
              -f docker-compose.yml -f compose.$e.yml -f compose.sem-frontend.yml config -q
            echo "$e sem frontend OK"
          done
          docker compose --env-file ops.env.example -f compose.ops.yml config -q
          echo "ops OK"
